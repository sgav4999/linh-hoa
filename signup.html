<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Linh Hua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Linh<span>Hua</span></a>
    <div class="nav-wrap" id="navWrap">
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a href="login.html" class="btn-header-secondary">Log In</a>
      <a href="signup.html" class="btn btn-primary btn-header">Sign Up</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="auth-section">
    <div class="container">
      <div class="contact-card auth-card">
        <h1>Create your account</h1>
        <p class="auth-sub">Sign up to start a course or manage courses as staff.</p>

        <div id="formMessage" class="form-message"></div>

        <form class="contact-form" id="signupForm">
          <div>
            <label>I am a...</label>
            <div class="role-cards">
              <label class="role-card selected">
                <input type="radio" name="role" value="student" checked>
                <strong>Student</strong>
                <span>Taking a licensing course</span>
              </label>
              <label class="role-card">
                <input type="radio" name="role" value="staff">
                <strong>Staff</strong>
                <span>Managing courses &amp; students</span>
              </label>
            </div>
          </div>
          <div>
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required autocomplete="name">
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
          </div>
          <div>
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hua. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
</body>
</html>
