<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — Linh Hoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Linh<span>Hoa</span></a>
    <div class="nav-wrap" id="navWrap">
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-label="Account menu">
          <span class="user-avatar" id="userAvatar"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
          <div class="user-menu-info">
            <strong id="userMenuName">&nbsp;</strong>
            <span id="userMenuEmail">&nbsp;</span>
          </div>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account Settings</a>
          <button type="button" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="accountRoot">
  <section class="page-hero">
    <div class="hero-glow"></div>
    <div class="container">
      <span class="eyebrow">Account</span>
      <h1>Account Settings</h1>
      <p>Update your profile photo, name, and password.</p>
    </div>
  </section>

  <section class="page-section">
    <div class="container account-container">
      <div id="formMessage" class="form-message"></div>

      <div class="contact-card">
        <h2 class="account-card-title">Profile</h2>
        <form class="contact-form" id="profileForm">
          <div class="account-avatar-row">
            <span class="user-avatar account-avatar-preview" id="avatarPreview"></span>
            <div>
              <label for="avatarInput" class="btn btn-secondary">Change Photo</label>
              <input type="file" id="avatarInput" accept="image/*" hidden>
              <p class="account-avatar-hint">JPG or PNG, up to a few MB.</p>
            </div>
          </div>
          <div>
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
        </form>
      </div>

      <div class="contact-card account-password-card">
        <h2 class="account-card-title">Change Password</h2>
        <form class="contact-form" id="passwordForm">
          <div>
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
          </div>
          <div>
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-secondary btn-lg">Update Password</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hoa. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="account.js"></script>
</body>
</html>
