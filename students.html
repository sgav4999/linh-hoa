<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrolled Students — Linh Hoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Linh<span>Hoa</span></a>
    <div class="nav-wrap" id="navWrap">
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="students.html" class="active">Students</a>
      </nav>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-label="Account menu">
          <span class="user-avatar" id="userAvatar"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
          <div class="user-menu-info">
            <strong id="userMenuName">&nbsp;</strong>
            <span id="userMenuEmail">&nbsp;</span>
          </div>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account Settings</a>
          <button type="button" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="studentsRoot">
  <section class="page-hero">
    <div class="hero-glow"></div>
    <div class="container">
      <span class="eyebrow">Staff Only</span>
      <h1>Enrolled Students</h1>
      <p>Everyone who has created an account, students and staff.</p>
    </div>
  </section>

  <section class="page-section">
    <div class="container">
      <div id="formMessage" class="form-message"></div>

      <div class="students-toolbar">
        <input type="search" id="studentSearch" placeholder="Search by name or email..." class="students-search">
        <div id="studentStats" class="students-stats"></div>
      </div>

      <div class="students-table-wrap">
        <table class="students-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hoa. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="students.js"></script>
</body>
</html>
